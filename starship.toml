"$schema" = 'https://starship.rs/config-schema.json'

continuation_prompt = "[▸▹ ](dimmed white)"

#[](#a3aed2)\

format = """
$os\
[](bg:#769ff0 fg:#DFE5EB)\
$directory\
[](fg:#769ff0 bg:#394260)\
$git_branch\
$git_status\
[](fg:#394260 bg:#212736)\
$nodejs\
$bun\
$rust\
$golang\
$php\
[](fg:#212736 )\
\n$character"""

#[](fg:#212736 bg:#1d2230)\

palette = 'peter'

right_format = """
$battery\
[](fg:widget_time_bg_color)\
[ $time ](bg:widget_time_bg_color)\
"""

[directory]
style = "fg:#e3e5e5 bg:#769ff0"
format = "[$read_only $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
read_only = " "

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
"~" = " ~"

[git_branch]
symbol = ""
style = "bg:#394260"
format = '[[ $symbol $branch ](fg:#769ff0 bg:#394260)]($style)'

[git_status]
style = "bg:#394260"
format = '[[($all_status$ahead_behind )](fg:#769ff0 bg:#394260)]($style)'

[nodejs]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[bun]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[rust]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[golang]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[php]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[character]
success_symbol = "[❯](bold character_success_color)"
error_symbol = "[❯](bold character_error_color)"

[time]
disabled = false
utc_time_offset = "local"
time_format = "%R" # Hour:Minute Format
style = "bg:widget_time_bg_color fg:widget_time_fg_color"
format = '[$time ]($style)'

[os]
style = "bg:widget_os_bg_color fg:widget_os_fg_color"
format = "[ $symbol ]($style)"
disabled = false

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[palettes.peter]
widget_time_bg_color = "#DFE5EB"
widget_time_fg_color = "#38424B"
widget_os_bg_color = "#DFE5EB"
widget_os_fg_color = "#090c0c"
character_success_color = "#80D440"
character_error_color = "#C83323"


